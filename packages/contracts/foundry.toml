[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]
fs_permissions = [{ access = "read-write", path = "../../deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
robinhood_testnet = { key = "${ROBINHOOD_TESTNET_VERIFIER_KEY}", url = "${ROBINHOOD_TESTNET_VERIFIER_URL}", chain = 46630 }
