[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]
fs_permissions = [{ access = "read-write", path = "../../deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# Intentionally no [etherscan] block here. Contract verification is a separate, optional,
# manual step — see README.md § "Testnet deployment" — rather than something the default deploy
# command attempts automatically. Wiring it up unconditionally would mean `--verify` silently
# fails (or behaves unpredictably) for anyone who hasn't configured Blockscout verifier
# variables, which is most people running the demo deploy.
